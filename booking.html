<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G.M.STUDIO - Cloud Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
            --text-main: #1e293b; --text-sub: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }

        /* UI Components */
        .glass-card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        header { text-align: center; padding-bottom: 10px; }
        header h1 { margin: 0; font-size: 26px; color: var(--primary); font-weight: 800; letter-spacing: -1px; }

        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-sub); text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border); font-family: 'Sarabun'; font-size: 15px; margin-bottom: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .grid-3 { grid-template-columns: 1fr; } }

        .room-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .room-opt { flex: 1; text-align: center; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); cursor: pointer; font-weight: 600; background: #fff; color: var(--text-sub); transition: 0.3s; }
        .room-opt.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }

        .btn-main { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--primary); color: white; transition: 0.3s; }
        .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
        
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-nav { padding: 12px; border-radius: 12px; border: none; background: #334155; color: white; font-size: 12px; cursor: pointer; font-weight: 600; }

        .booking-item { background: white; border-radius: 16px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .btn-info { background: #eff6ff; color: var(--primary); border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        
        .badge { padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; }
        .paid { background: #dcfce7; color: #15803d; }
        .unpaid { background: #fee2e2; color: #991b1b; }

        /* Modal & Animations */
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 15px; }
        .modal { background: white; width: 100%; max-width: 450px; border-radius: 32px; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Success Animation UI */
        .success-checkmark { width: 80px; height: 80px; margin: 0 auto 20px; }
        .check-icon { width: 80px; height: 80px; position: relative; border-radius: 50%; box-sizing: content-box; border: 4px solid #4CAF50; }
        .check-icon::before { top: 3px; left: -2px; width: 30px; transform-origin: 100% 50%; border-radius: 100px 0 0 100px; }
        .check-icon::after { top: 0; left: 30px; width: 60px; transform-origin: 0 50%; border-radius: 0 100px 100px 0; animation: rotatePlaceholder 4.25s ease-in; }
        .check-icon::before, .check-icon::after { content: ''; height: 100px; position: absolute; background: #FFFFFF; transform: rotate(-45deg); }
        .check-icon .icon-line { height: 5px; background-color: #4CAF50; display: block; border-radius: 2px; position: absolute; z-index: 10; }
        .check-icon .icon-line.line-tip { top: 46px; left: 14px; width: 25px; transform: rotate(45deg); animation: icon-line-tip 0.75s; }
        .check-icon .icon-line.line-long { top: 38px; right: 8px; width: 47px; transform: rotate(-45deg); animation: icon-line-long 0.75s; }
        .check-icon .icon-circle { top: -4px; left: -4px; z-index: 10; width: 80px; height: 80px; border-radius: 50%; border: 4px solid rgba(76, 175, 80, .5); box-sizing: content-box; position: absolute; }
        
        @keyframes icon-line-tip { 0% { width: 0; left: 1px; top: 19px; } 54% { width: 0; left: 1px; top: 19px; } 70% { width: 50px; left: -8px; top: 37px; } 84% { width: 17px; left: 21px; top: 48px; } 100% { width: 25px; left: 14px; top: 46px; } }
        @keyframes icon-line-long { 0% { width: 0; right: 46px; top: 54px; } 65% { width: 0; right: 46px; top: 54px; } 84% { width: 55px; right: 0px; top: 35px; } 100% { width: 47px; right: 8px; top: 38px; } }

        .table-scroll { overflow-x: auto; margin-top: 15px; border: 1px solid var(--border); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { border: 1px solid var(--border); padding: 8px; font-size: 11px; text-align: center; }
        .merged-cell { background: #e0e7ff; color: var(--primary); font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>G.M.STUDIO PRO</h1></header>

    <div class="glass-card">
        <div class="grid-3">
            <div><label>วันที่จอง</label><input type="date" id="m-date" onchange="resetSelection();"></div>
            <div><label>เริ่ม</label><select id="m-start" onchange="syncEndTime()"></select></div>
            <div><label>เลิก</label><select id="m-end" onchange="checkConflict()"></select></div>
        </div>

        <label>เลือกห้องซ้อม</label>
        <div class="room-row">
            <div class="room-opt" onclick="selectRoom(this, 'Room 1')">Room 1</div>
            <div class="room-opt" onclick="selectRoom(this, 'Room 2')">Room 2</div>
            <div class="room-opt" onclick="selectRoom(this, 'Room 3')">Room 3</div>
        </div>

        <div class="grid-3" style="grid-template-columns: 2fr 1fr;">
            <div><label>ชื่อวงดนตรี</label><input type="text" id="m-band" placeholder="ระบุชื่อวง..."></div>
            <div><label>เบอร์โทร</label><input type="tel" id="m-phone" placeholder="08x-xxxxxxx"></div>
        </div>

        <button class="btn-main" id="btn-submit" onclick="reviewBooking()" disabled>🔍 ตรวจสอบข้อมูลการจอง</button>
        
        <div class="nav-grid">
            <button class="btn-nav" onclick="openWeekly()">📅 ตารางสัปดาห์</button>
            <button class="btn-nav" onclick="openHistory()">📋 ประวัติการจอง</button>
            <button class="btn-nav" style="background:var(--primary)" onclick="openRev()">💰 รายได้</button>
        </div>
    </div>

    <div id="today-area"></div>
</div>

<div id="modalOverlay" class="overlay" onclick="if(event.target==this) closeMod()">
    <div class="modal" id="modalBox"></div>
</div>

<script>
    // --- 1. Firebase Config ---
    const firebaseConfig = {
        apiKey: "AIzaSyBbqbTXU9LohB2uZ7i2r-ODyWShURixxpA",
        authDomain: "gmstudio-booking.firebaseapp.com",
        projectId: "gmstudio-booking",
        storageBucket: "gmstudio-booking.firebasestorage.app",
        messagingSenderId: "158284564213",
        appId: "1:158284564213:web:5b3d17f0ec45433fd827bc",
        measurementId: "G-0J2ZN1S9BE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let activeRoom = null;
    let database = {}; 
    const timeRef = []; for(let i=10; i<=21.5; i+=0.5) timeRef.push(i);

    window.onload = () => {
        document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
        initTimeOptions();
        listenForBookings(); 
    };

    function listenForBookings() {
        db.collection("bookings").onSnapshot((snapshot) => {
            database = {}; snapshot.forEach(doc => {
                const data = doc.data(); const d = data.date; const r = data.room;
                if (!database[d]) database[d] = {};
                if (!database[d][r]) database[d][r] = [];
                database[d][r].push({ ...data, id: doc.id });
            });
            renderToday(); checkConflict();
        });
    }

    function fmt(t) {
        let h = Math.floor(t); let m = t % 1 === 0.5 ? "30" : "00";
        return `${h.toString().padStart(2,'0')}:${m}`;
    }

    function initTimeOptions(tStart='m-start', tEnd='m-end') {
        const s = document.getElementById(tStart);
        s.innerHTML = `<option value="" disabled selected>-- เริ่ม --</option>`;
        timeRef.forEach(t => s.innerHTML += `<option value="${t}">${fmt(t)}</option>`);
        document.getElementById(tEnd).innerHTML = `<option value="" disabled selected>-- เลิก --</option>`;
    }

    function syncEndTime(tStart='m-start', tEnd='m-end') {
        const sVal = parseFloat(document.getElementById(tStart).value);
        const e = document.getElementById(tEnd);
        e.innerHTML = `<option value="" disabled selected>-- เลิก --</option>`;
        for(let t = sVal + 0.5; t <= 22; t += 0.5) e.innerHTML += `<option value="${t}">${fmt(t)}</option>`;
    }

    function resetSelection() {
        activeRoom = null; document.querySelectorAll('.room-opt').forEach(el => el.classList.remove('active'));
        initTimeOptions(); renderToday(); updateBtn(true, "🔍 ตรวจสอบข้อมูลการจอง");
    }

    function selectRoom(el, roomName) {
        activeRoom = roomName; document.querySelectorAll('.room-opt').forEach(opt => opt.classList.remove('active'));
        el.classList.add('active'); checkConflict();
    }

    function checkConflict() {
        const d = document.getElementById('m-date').value;
        const s = parseFloat(document.getElementById('m-start').value);
        const e = parseFloat(document.getElementById('m-end').value);
        if(!activeRoom || isNaN(s) || isNaN(e)) { updateBtn(true, "🔍 ตรวจสอบข้อมูลการจอง"); return; }
        let isBusy = database[d]?.[activeRoom]?.some(b => (s < b.end && e > b.start));
        if(isBusy) updateBtn(true, "❌ เวลานี้ถูกจองแล้ว"); else updateBtn(false, "🔍 ตรวจสอบข้อมูลการจอง");
    }

    function updateBtn(disabled, text) {
        const btn = document.getElementById('btn-submit');
        btn.disabled = disabled; btn.innerText = text;
    }

    // --- 2. Step: Review & Confirm ---
    function reviewBooking() {
        const band = document.getElementById('m-band').value.trim();
        const phone = document.getElementById('m-phone').value.trim();
        const d = document.getElementById('m-date').value;
        const s = parseFloat(document.getElementById('m-start').value);
        const e = parseFloat(document.getElementById('m-end').value);

        if(!band || !phone) return alert("กรุณากรอกข้อมูลให้ครบ");

        const box = document.getElementById('modalBox');
        box.innerHTML = `
            <h2 style="text-align:center; margin-top:0;">ยืนยันข้อมูล</h2>
            <div style="background:#f1f5f9; padding:20px; border-radius:20px; margin-bottom:20px;">
                <div class="detail-row"><span>วง:</span><b>${band}</b></div>
                <div class="detail-row"><span>เบอร์:</span><b>${phone}</b></div>
                <div class="detail-row"><span>ห้อง:</span><b>${activeRoom}</b></div>
                <div class="detail-row"><span>เวลา:</span><b>${fmt(s)} - ${fmt(e)}</b></div>
            </div>
            <button class="btn-main btn-success" id="finalConfirmBtn" onclick="executeSave('${band}', '${phone}', '${d}', ${s}, ${e})">✅ ยืนยันและบันทึก</button>
            <button class="btn-nav" style="width:100%; margin-top:10px; background:#e2e8f0; color:#475569;" onclick="closeMod()">กลับไปแก้ไข</button>
        `;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    async function executeSave(band, phone, d, s, e) {
        const btn = document.getElementById('finalConfirmBtn');
        btn.disabled = true; btn.innerText = "กำลังบันทึก...";
        
        try {
            await db.collection("bookings").add({ band, phone, date: d, start: s, end: e, room: activeRoom, paid: false });
            showSuccessUI(band);
            document.getElementById('m-band').value = ''; document.getElementById('m-phone').value = '';
            resetSelection();
        } catch (err) { alert(err.message); btn.disabled = false; }
    }

    // --- 3. Premium Success UI ---
    function showSuccessUI(band) {
        const box = document.getElementById('modalBox');
        box.innerHTML = `
            <div style="text-align:center;">
                <div class="success-checkmark">
                    <div class="check-icon">
                        <span class="icon-line line-tip"></span>
                        <span class="icon-line line-long"></span>
                        <div class="icon-circle"></div>
                    </div>
                </div>
                <h2 style="color:var(--success); margin-bottom:5px;">บันทึกการจองสำเร็จ!</h2>
                <p style="color:var(--text-sub); margin-bottom:25px;">วง <b>${band}</b> ได้รับการยืนยันแล้ว</p>
                <button class="btn-main" onclick="closeMod()">เรียบร้อย</button>
            </div>
        `;
    }

    // --- 4. Edit & Other Features ---
    function viewDetail(docId) {
        let found = null;
        Object.values(database).forEach(dates => Object.values(dates).forEach(rooms => {
            let match = rooms.find(b => b.id === docId); if(match) found = match;
        }));
        if(!found) return;

        const box = document.getElementById('modalBox');
        box.innerHTML = `
            <h2 style="text-align:center;">รายละเอียด</h2>
            <div style="background:#f8fafc; padding:20px; border-radius:20px;">
                <div class="detail-row"><span>วง:</span><b>${found.band}</b></div>
                <div class="detail-row"><span>โทร:</span><b>${found.phone}</b></div>
                <div class="detail-row"><span>ห้อง:</span><b>${found.room}</b></div>
                <div class="detail-row"><span>วันที่:</span><b>${found.date}</b></div>
                <div class="detail-row"><span>เวลา:</span><b>${fmt(found.start)} - ${fmt(found.end)}</b></div>
            </div>
            <button class="btn-warning" onclick="editBooking('${docId}')">✏️ แก้ไขข้อมูล</button>
            <button class="btn-del" onclick="deleteBooking('${docId}')">🗑️ ลบคิวจอง</button>
            <button class="btn-nav" style="width:100%; margin-top:10px; background:#334155;" onclick="closeMod()">ปิด</button>
        `;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function editBooking(docId) {
        let found = null;
        Object.values(database).forEach(dates => Object.values(dates).forEach(rooms => {
            let match = rooms.find(b => b.id === docId); if(match) found = match;
        }));

        const box = document.getElementById('modalBox');
        box.innerHTML = `
            <h2 style="text-align:center;">แก้ไขการจอง</h2>
            <label>ชื่อวงดนตรี</label><input type="text" id="edit-band" value="${found.band}">
            <label>เบอร์โทร</label><input type="tel" id="edit-phone" value="${found.phone}">
            <label>วันที่</label><input type="date" id="edit-date" value="${found.date}">
            <div class="grid-3">
                <div><label>เริ่ม</label><select id="edit-start"></select></div>
                <div><label>เลิก</label><select id="edit-end"></select></div>
                <div><label>ห้อง</label>
                    <select id="edit-room">
                        <option value="Room 1" ${found.room=='Room 1'?'selected':''}>Room 1</option>
                        <option value="Room 2" ${found.room=='Room 2'?'selected':''}>Room 2</option>
                        <option value="Room 3" ${found.room=='Room 3'?'selected':''}>Room 3</option>
                    </select>
                </div>
            </div>
            <button class="btn-main btn-success" onclick="updateFirestore('${docId}')">💾 บันทึกการแก้ไข</button>
            <button class="btn-nav" style="width:100%; margin-top:10px; background:#334155;" onclick="viewDetail('${docId}')">ยกเลิก</button>
        `;
        
        initTimeOptions('edit-start', 'edit-end');
        document.getElementById('edit-start').value = found.start;
        syncEndTime('edit-start', 'edit-end');
        document.getElementById('edit-end').value = found.end;
        document.getElementById('edit-start').onchange = () => syncEndTime('edit-start', 'edit-end');
    }

    async function updateFirestore(docId) {
        const band = document.getElementById('edit-band').value;
        const phone = document.getElementById('edit-phone').value;
        const date = document.getElementById('edit-date').value;
        const start = parseFloat(document.getElementById('edit-start').value);
        const end = parseFloat(document.getElementById('edit-end').value);
        const room = document.getElementById('edit-room').value;
        await db.collection("bookings").doc(docId).update({ band, phone, date, start, end, room });
        closeMod();
    }

    function renderToday() {
        const d = document.getElementById('m-date').value;
        const area = document.getElementById('today-area');
        area.innerHTML = `<p style="font-weight:700; color:var(--text-sub); margin: 20px 0 10px 0;">คิววันนี้ (${d}):</p>`;
        let all = []; if(database[d]) Object.keys(database[d]).forEach(r => database[d][r].forEach(b => all.push(b)));
        all.sort((a,b) => a.start - b.start);
        if(all.length === 0) { area.innerHTML += `<div style="text-align:center; padding:40px; color:#cbd5e1; background:white; border-radius:20px; border:1px dashed #e2e8f0;">ยังไม่มีการจอง</div>`; return; }
        all.forEach(b => {
            area.innerHTML += `<div class="booking-item"><div><b style="color:var(--primary); font-size:16px;">${fmt(b.start)} - ${fmt(b.end)}</b><br><small style="font-weight:700;">วง ${b.band} | ${b.room}</small></div><div style="display:flex; gap:8px;"><button class="btn-info" onclick="viewDetail('${b.id}')">ข้อมูล</button><button class="badge ${b.paid?'paid':'unpaid'}" onclick="togglePaid('${b.id}', ${b.paid})">${b.paid?'จ่ายแล้ว':'ค้างจ่าย'}</button></div></div>`;
        });
    }

    async function togglePaid(docId, cur) { await db.collection("bookings").doc(docId).update({ paid: !cur }); }
    async function deleteBooking(docId) { if(confirm("ลบคิวนี้?")) { await db.collection("bookings").doc(docId).delete(); closeMod(); } }
    function closeMod() { document.getElementById('modalOverlay').style.display = 'none'; document.getElementById('modalBox').style.maxWidth = "450px"; }

    // Navigation Modals
    function openWeekly() {
        if(!activeRoom) return alert("เลือกห้องก่อน");
        const box = document.getElementById('modalBox'); box.style.maxWidth = "950px";
        let html = `<h3>ตารางสัปดาห์: ${activeRoom}</h3><div class="table-scroll"><table><thead><tr><th>วัน</th>`;
        for(let i=10; i<22; i++) html += `<th colspan="2">${i}:00</th>`;
        html += `</tr></thead><tbody>`;
        const now = new Date();
        for(let i=0; i<7; i++) {
            const d = new Date(); d.setDate(now.getDate()+i); const ds = d.toISOString().split('T')[0];
            html += `<tr><td style="background:#f8fafc; font-weight:bold;">${d.toLocaleDateString('th-TH',{weekday:'short', day:'numeric'})}</td>`;
            let bks = (database[ds]?.[activeRoom] || []).sort((a,b)=>a.start-b.start);
            for(let t=10; t<22; t+=0.5) {
                const bk = bks.find(b => t >= b.start && t < b.end);
                if(bk && t === bk.start) {
                    let span = (bk.end - bk.start) / 0.5;
                    html += `<td colspan="${span}" class="merged-cell" onclick="viewDetail('${bk.id}')">${bk.band}</td>`; t += (span * 0.5) - 0.5;
                } else html += `<td></td>`;
            }
            html += `</tr>`;
        }
        box.innerHTML = html + `</tbody></table></div><button class="btn-main" style="margin-top:20px; background:#334155;" onclick="closeMod()">ปิด</button>`;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function openRev() {
        let total = 0; Object.values(database).forEach(dates => Object.values(dates).forEach(rooms => rooms.forEach(b => {
            if(b.paid) total += (b.end - b.start) * (b.room === 'Room 3' ? 300 : 250);
        })));
        const box = document.getElementById('modalBox');
        box.innerHTML = `<h2>รายได้รวม</h2><h1 style="color:var(--success); text-align:center;">฿${total.toLocaleString()}</h1><button class="btn-main" onclick="closeMod()">ตกลง</button>`;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function openHistory() {
        const box = document.getElementById('modalBox');
        let html = `<h2>ประวัติ</h2><div style="max-height:400px; overflow-y:auto;">`;
        let all = []; Object.values(database).forEach(dates => Object.values(dates).forEach(rooms => rooms.forEach(b => all.push(b))));
        all.sort((a,b) => new Date(b.date) - new Date(a.date));
        all.forEach(b => { html += `<div class="booking-item"><span><b>${b.date}</b><br>${b.band}</span><button class="btn-info" onclick="viewDetail('${b.id}')">ดู</button></div>`; });
        box.innerHTML = html + `</div><button class="btn-main" style="margin-top:20px; background:#334155;" onclick="closeMod()">ปิด</button>`;
        document.getElementById('modalOverlay').style.display = 'flex';
    }
</script>
</body>
</html>
